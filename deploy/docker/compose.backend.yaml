# Laptop backend only (no Next.js web). Pair with Vercel-hosted dashboard.
# From repo root:
#   copy deploy\docker\env.hybrid.example deploy\docker\.env
#   docker compose -f deploy/docker/compose.backend.yaml --env-file deploy/docker/.env up --build -d
name: linkspire

x-app-env: &app-env
  ENV: ${LINKSPIRE_ENV:-dev}
  PG_ENABLED: "true"
  PG_DSN: "postgresql://root@cockroach:26257/linkspire?sslmode=disable"
  REDIS_ENABLED: "true"
  REDIS_ADDRS: "redis:6379"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: "redpanda:9092"
  TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:-dev-insecure-token-key-change-me}
  FEISTEL_KEY: ${FEISTEL_KEY:-dev-insecure-feistel-key-change}
  COOKIE_SIGNING_KEY: ${COOKIE_SIGNING_KEY:-dev-insecure-cookie-key-change-me}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  DEFAULT_DOMAIN_ID: "1"
  DEFAULT_DOMAIN_HOST: ${DEFAULT_DOMAIN_HOST:-localhost:8080}
  QR_PUBLIC_BASE: ${QR_PUBLIC_BASE:-}
  ASSET_DIR: "/var/linkspire/qr"
  QR_ASSET_DIR: "/var/linkspire/qr"

services:
  cockroach:
    image: cockroachdb/cockroach:v24.2.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8090:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/redpanda-init.sh"]
    volumes:
      - ./redpanda-init.sh:/init/redpanda-init.sh:ro
    environment:
      KAFKA_BROKERS: redpanda:9092
    restart: "no"

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9009:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../db/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./clickhouse-allow-docker.xml:/etc/clickhouse-server/users.d/allow-docker.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: cockroachdb/cockroach:v24.2.3
    depends_on:
      cockroach: { condition: service_healthy }
    volumes:
      - ../../db/migrations:/migrations:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        ./cockroach sql --insecure --host=cockroach -e "CREATE DATABASE IF NOT EXISTS linkspire;"
        if ./cockroach sql --insecure --host=cockroach --database=linkspire -e "SELECT 1 FROM workspaces LIMIT 1;" >/dev/null 2>&1; then
          echo "Schema already present; skipping migrations."
          exit 0
        fi
        for f in 000001_enums 000002_identity 000003_domains 000004_links 000005_governance 000007_ops; do
          echo "Applying $$f..."
          ./cockroach sql --insecure --host=cockroach --database=linkspire -f "/migrations/$$f.up.sql"
        done
        echo "Migrations complete (000006 skipped for local single-node)."
    restart: "no"

  redirect:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.redirect
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
    ports:
      - "8080:8080"
    depends_on:
      cockroach: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redpanda-init: { condition: service_completed_successfully }

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      <<: *app-env
      HTTP_ADDR: ":8081"
      METRICS_ADDR: ":9091"
      CLICKHOUSE_URL: "http://clickhouse:8123"
    volumes:
      - qr-assets:/var/linkspire/qr
    ports:
      - "8081:8081"
    depends_on:
      cockroach: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  workers:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.workers
    environment:
      <<: *app-env
      WORKER_ROLE: "all"
      METRICS_ADDR: ":9092"
    volumes:
      - qr-assets:/var/linkspire/qr
    depends_on:
      cockroach: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  cockroach-data:
  clickhouse-data:
  qr-assets:
