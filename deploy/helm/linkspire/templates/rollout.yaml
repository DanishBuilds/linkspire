{{- if .Values.rollouts.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.canary.enabled }}
---
# Rendered instead of a Deployment when rollouts.enabled and this service's
# canary.enabled are both true (see deployment.yaml guard). Requires the Argo
# Rollouts controller.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "linkspire.fullname" $ }}-{{ $name }}
  labels:
    {{- include "linkspire.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        {{- include "linkspire.commonLabels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "linkspire.serviceAccountName" $ }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "linkspire.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if gt (int ($svc.port | default 0)) 0 }}
            - name: http
              containerPort: {{ $svc.port }}
            {{- end }}
            {{- if gt (int ($svc.metricsPort | default 0)) 0 }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
            {{- end }}
          {{- if eq $svc.kind "go" }}
          envFrom:
            - configMapRef:
                name: {{ include "linkspire.fullname" $ }}-config
            {{- if $.Values.secrets.create }}
            - secretRef:
                name: {{ include "linkspire.fullname" $ }}-secrets
            {{- end }}
          {{- end }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if eq $svc.kind "go" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $svc.metricsPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /login
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $svc.kind "web" }}
            - name: next-cache
              mountPath: /app/.next/cache
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $svc.kind "web" }}
        - name: next-cache
          emptyDir: {}
        {{- end }}
  strategy:
    canary:
      steps:
        {{- toYaml $svc.canary.steps | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
