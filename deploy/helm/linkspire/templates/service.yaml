{{- range $name, $svc := .Values.services }}
{{- if gt (int ($svc.port | default 0)) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkspire.fullname" $ }}-{{ $name }}
  labels:
    {{- include "linkspire.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
