{{/* services/redirect/internal/handler/templates/password.html */}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Protected link</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:28rem;margin:4rem auto;padding:0 1rem;color:#1b1b1b}
    .card{border:1px solid #ddd;border-radius:.5rem;padding:1.5rem}
    h1{font-size:1.3rem}
    input[type=password]{width:100%;padding:.6rem;border:1px solid #bbb;border-radius:.25rem;box-sizing:border-box}
    button{margin-top:1rem;padding:.6rem 1rem;border:0;border-radius:.25rem;background:#1552d4;color:#fff;cursor:pointer}
    .err{color:#b00020;margin-top:.5rem}
  </style>
</head>
<body>
  <main class="card">
    <h1>🔒 This link is password protected</h1>
    <form method="POST" action="/{{.Code}}">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="pw">Enter password</label>
      <input id="pw" type="password" name="password" autocomplete="off" autofocus required>
      {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
      <button type="submit">Unlock</button>
    </form>
  </main>
</body>
</html>
